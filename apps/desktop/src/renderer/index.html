<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!--
      内容安全策略。

      `script-src 'self'` 仍然锁死：脚本只能来自本包，没有内联脚本、没有远程脚本。
      **`style-src` 加了 `'unsafe-inline'`**，这是接 antd 时必须付的代价：
      antd 5 的样式是 CSS-in-JS（`@ant-design/cssinjs`），它在运行时往文档里插
      `<style>` 标签，并且大量组件（Flex / Space / 网格、拖拽定位、虚拟列表）
      直接在元素上写内联 `style`。这两样都被原来的 `style-src 'self'` 拦掉——
      拦住的结果不是"样式降级"，是**布局整个塌掉**。

      这个取舍是有意的：脚本注入面（XSS 的主要风险面）没有变宽，放宽的只是
      "样式可以从哪来"。`script-src 'self'` 那一条没有任何让步。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;"
    />
    <title>ArchItect</title>
    <!--
      esbuild 会把 `main.tsx` 里 import 的 CSS **抽成一个独立文件**（`main.css`），
      而且抽取模式下它**不做运行时注入**。所以这一行不能少：少了它，整个界面就没有
      定位样式——`.viewport-stage` 高度塌成 0、两层画布退回 300×150 的默认尺寸。
      （症状很隐蔽：抓窗口看还行，但模型截图是小图、状态行写着 `canvas 300x150`。）

      `style-src 'self'` 允许本包的同源样式表，所以这条链接与 CSP 不冲突；
      加 `'unsafe-inline'` 是为了 antd 的 CSS-in-JS（见上面那段注释）。
    -->
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <!-- 界面整个由 React 渲染（见 renderer/main.tsx）。这里只剩一个挂载点。 -->
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
